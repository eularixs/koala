name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project koala.xcodeproj \
            -scheme koala \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
        shell: bash

      - name: Test
        run: |
          xcodebuild \
            -project koala.xcodeproj \
            -scheme koala \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test
        shell: bash

  pr-title-check:
    name: PR Title Convention
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title prefix
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Safe: TITLE comes from env, not interpolation in the shell script body.
          case "$TITLE" in
            major:\ *|minor:\ *|patch:\ *)
              echo "OK"
              ;;
            *)
              echo "::error::PR title must start with 'major: ', 'minor: ' or 'patch: '."
              exit 1
              ;;
          esac
